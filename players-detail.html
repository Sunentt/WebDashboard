<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TI 2026 — Детали игроков</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14; --bg2:#0f141c; --card:#141a24; --card2:#1a2230;
    --border:rgba(255,255,255,.07);
    --text:#e8ecf1; --muted:#8892a0;
    --radiant:#2ecc71; --dire:#e63946;
    --gold:#f4a261; --blue:#4ea8de; --purple:#9d4edd;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
    padding:24px;min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 0%,rgba(46,204,113,.08),transparent 40%),
      radial-gradient(circle at 85% 100%,rgba(230,57,70,.08),transparent 40%);
  }
  .dashboard{max-width:1700px;margin:0 auto;display:grid;
    grid-template-columns:repeat(12,1fr);gap:16px}

  .card{background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid var(--border);border-radius:16px;padding:20px;
    backdrop-filter:blur(12px);transition:.25s;position:relative;overflow:hidden}
  .card:hover{border-color:rgba(244,162,97,.35);
    box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .card-title{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;
    text-transform:uppercase;letter-spacing:1.8px;color:var(--muted);
    margin-bottom:18px;display:flex;align-items:center;gap:8px}
  .card-title::before{content:'';width:4px;height:14px;background:var(--gold);
    border-radius:2px;box-shadow:0 0 10px var(--gold)}

  /* TOP BAR */
  .topbar{grid-column:span 12;display:flex;align-items:center;
    justify-content:space-between;gap:16px;padding:16px 24px;
    background:linear-gradient(135deg,var(--card),var(--bg2));
    border:1px solid var(--border);border-radius:16px;position:relative;
    overflow:hidden}
  .topbar::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--radiant),var(--gold),var(--dire))}
  .topbar h1{font-family:'Rajdhani';font-size:22px;font-weight:700;
    letter-spacing:1px}
  .topbar h1 span{color:var(--gold)}
  .back-btn{display:inline-flex;align-items:center;gap:8px;
    font-family:'Rajdhani';font-size:14px;font-weight:700;
    text-transform:uppercase;letter-spacing:1.5px;padding:10px 22px;
    border-radius:10px;border:1px solid var(--gold);cursor:pointer;
    background:linear-gradient(135deg,rgba(244,162,97,.2),rgba(244,162,97,.05));
    color:var(--gold);box-shadow:0 0 20px rgba(244,162,97,.2);
    text-decoration:none;transition:.25s}
  .back-btn:hover{transform:translateX(-3px);
    box-shadow:0 0 30px rgba(244,162,97,.4)}

  /* PLAYER TABS */
  .player-tabs{grid-column:span 12;display:flex;gap:8px;flex-wrap:wrap;
    padding:12px;background:var(--card);border-radius:14px;
    border:1px solid var(--border)}
  .ptab{display:flex;align-items:center;gap:8px;padding:8px 14px;
    border-radius:10px;cursor:pointer;border:1px solid transparent;
    transition:.2s;font-size:13px;font-weight:600;
    background:rgba(255,255,255,.03)}
  .ptab:hover{border-color:rgba(244,162,97,.4)}
  .ptab.active{border-color:var(--gold);background:rgba(244,162,97,.1);
    box-shadow:0 0 16px rgba(244,162,97,.2)}
  .ptab .pav{width:28px;height:28px;border-radius:6px;overflow:hidden;
    background:#1a2230;flex-shrink:0;border:1px solid rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;font-size:9px;
    font-family:'Rajdhani';font-weight:700;color:var(--gold)}
  .ptab .pav img{width:100%;height:100%;object-fit:cover;display:block}
  .ptab.radiant{border-left:3px solid var(--radiant)}
  .ptab.dire{border-left:3px solid var(--dire)}

  /* PLAYER DETAIL */
  .pdetail{grid-column:span 12;display:none;
    grid-template-columns:repeat(12,1fr);gap:16px}
  .pdetail.active{display:grid}
  .phead{grid-column:span 12;display:flex;align-items:center;gap:20px;
    padding:20px;background:linear-gradient(135deg,var(--card),var(--bg2));
    border:1px solid var(--border);border-radius:16px}
  .phead .pav{width:80px;height:80px;border-radius:14px;overflow:hidden;
    background:#1a2230;border:2px solid rgba(255,255,255,.1);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Rajdhani';font-size:18px;font-weight:700;color:var(--gold)}
  .phead .pav img{width:100%;height:100%;object-fit:cover;display:block}
  .phead.radiant .pav{border-color:rgba(46,204,113,.5)}
  .phead.dire .pav{border-color:rgba(230,57,70,.5)}
  .phead .pinfo{flex:1}
  .phead .pname{font-family:'Rajdhani';font-size:26px;font-weight:700}
  .phead .phero{font-size:12px;color:var(--muted);letter-spacing:2px;
    text-transform:uppercase;margin-top:4px}
  .phead .pkda{font-family:'JetBrains Mono';font-size:22px;font-weight:700}
  .kda-k{color:var(--radiant)} .kda-d{color:var(--dire)} .kda-a{color:var(--blue)}
  .phead .ptags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .ptag{font-size:10px;padding:4px 10px;border-radius:6px;
    background:rgba(255,255,255,.05);color:var(--muted);
    text-transform:uppercase;letter-spacing:1px}

  /* STAT GRID */
  .stat-grid{grid-column:span 12;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat-box{background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.05);
    border-radius:12px;padding:14px;text-align:center}
  .stat-box .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;
    letter-spacing:1.5px;margin-bottom:6px}
  .stat-box .val{font-family:'JetBrains Mono';font-size:20px;font-weight:700}
  .val.gold{color:var(--gold)} .val.green{color:var(--radiant)}
  .val.red{color:var(--dire)} .val.blue{color:var(--blue)}
  .val.purple{color:var(--purple)}

  /* TABLES */
  .scroll{max-height:420px;overflow-y:auto;border-radius:12px;
    border:1px solid rgba(255,255,255,.05)}
  .scroll::-webkit-scrollbar{width:6px}
  .scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}
  .scroll::-webkit-scrollbar-thumb{background:rgba(244,162,97,.3);
    border-radius:3px}

  .col-6{grid-column:span 6} .col-4{grid-column:span 4}

  .kill-row{display:flex;align-items:center;gap:10px;padding:8px 10px;
    border-bottom:1px solid rgba(255,255,255,.03);font-size:12px}
  .kill-row:hover{background:rgba(255,255,255,.03)}
  .kill-row .time{font-family:'JetBrains Mono';color:var(--muted);
    font-weight:700;min-width:52px}
  .kill-row .hero{display:flex;align-items:center;gap:6px}
  .kill-row .hero .himg{width:26px;height:26px;border-radius:5px;
    overflow:hidden;background:#1a2230;flex-shrink:0;display:flex;
    align-items:center;justify-content:center;font-size:8px;
    font-family:'Rajdhani';font-weight:700;color:var(--gold)}
  .kill-row .hero .himg img{width:100%;height:100%;object-fit:cover;
    display:block}
  .kill-row .skull{color:var(--dire);font-weight:700}
  .kill-row .smoke{font-size:9px;padding:2px 6px;border-radius:4px;
    background:rgba(244,162,97,.15);color:var(--gold);
    text-transform:uppercase;letter-spacing:1px;font-weight:700}

  .ab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:8px}
  .ab-card{background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.05);
    border-radius:10px;padding:10px;display:flex;justify-content:space-between;
    align-items:center;font-size:12px}
  .ab-card .aname{color:var(--muted);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:150px}
  .ab-card .acount{font-family:'JetBrains Mono';font-weight:700;
    color:var(--gold)}

  .item-row{display:flex;align-items:center;gap:10px;padding:6px 10px;
    border-bottom:1px solid rgba(255,255,255,.03);font-size:12px}
  .item-row:hover{background:rgba(255,255,255,.03)}
  .item-row .iimg{width:32px;height:32px;border-radius:6px;overflow:hidden;
    background:#1a2230;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:8px;color:var(--gold)}
  .item-row .iimg img{width:100%;height:100%;object-fit:contain;display:block}
  .item-row .iname{flex:1;color:var(--muted)}
  .item-row .icount{font-family:'JetBrains Mono';font-weight:700}

  .bb-row{display:flex;align-items:center;gap:10px;padding:6px 10px;
    border-bottom:1px solid rgba(255,255,255,.03);font-size:12px}
  .bb-row .time{font-family:'JetBrains Mono';color:var(--gold);
    font-weight:700}

  @media(max-width:1200px){
    .col-4,.col-6{grid-column:span 12}
    .phead{flex-wrap:wrap}
  }
</style>
</head>

function fmtTime(s){
  if (s < 0) return 'pre';
  const m = Math.floor(s/60);
  const sec = s % 60;
  return m + ':' + String(sec).padStart(2,'0');
}
function heroDisplayName(slug){
  if (!slug) return '?';
  return slug.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}
function heroShortName(slug){
  if (!slug) return '?';
  const map = {
    'juggernaut':'JUG','axe':'AXE','invoker':'INV','rubick':'RUB','hoodwink':'HOOD',
    'life_stealer':'LS','pangolier':'PANG','dark_seer':'DS','mirana':'MIRA','bane':'BANE'
  };
  return map[slug] || slug.slice(0,4).toUpperCase();
}
function buildHeroSources(hero){
  return [
    `https://www.dotabuff.com/assets/heroes/${hero}.jpg`,
    `https://cdn.stratz.com/images/dota2/heroes/${hero}_lg.png`,
    `https://steamcdn-a.akamaihd.net/apps/dota2/images/heroes/${hero}_full.png`,
    `https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/${hero}.png`,
    `https://api.opendota.com/apps/dota2/images/heroes/${hero}_full.png`
  ];
}
function buildItemSources(item){
  return [
    `https://cdn.stratz.com/images/dota2/items/${item}.png`,
    `https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/${item}.png`,
    `https://raw.githubusercontent.com/HighGroundVision/Hyperstone/master/images/items/${item}.png`
  ];
}
function createImg(container, sources, fallback, className){
  let img = container.querySelector('img');
  if (!img) {
    container.innerHTML = '';
    img = document.createElement('img');
    if (className) img.className = className;
    container.appendChild(img);
  }
  let idx = 0;
  img.onerror = function(){
    idx++;
    if (idx < sources.length) {
      img.src = sources[idx];
    } else {
      container.innerHTML = '';
      container.textContent = fallback || '?';
    }
  };
  img.src = sources[0];
}

(function renderPlayerDetails(){
  const tabsEl = document.getElementById('playerTabs');
  const detailEl = document.getElementById('playerDetailContainer');

  MATCH.players.forEach((p, i) => {
    const tab = document.createElement('div');
    tab.className = 'ptab ' + p.team;
    tab.dataset.index = i;

    const av = document.createElement('div');
    av.className = 'pav';
    av.textContent = heroShortName(p.hero_slug);
    createImg(av, buildHeroSources(p.hero_slug), heroShortName(p.hero_slug));

    const info = document.createElement('div');
    info.innerHTML = `<div style="font-family:'Rajdhani';font-weight:700">${p.name}</div>
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;
        letter-spacing:1px">${heroDisplayName(p.hero_slug)}</div>`;

    tab.appendChild(av);
    tab.appendChild(info);
    tab.addEventListener('click', () => selectPlayer(i));
    tabsEl.appendChild(tab);
  });

  MATCH.players.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'pdetail';
    div.id = 'pdetail-' + i;
    detailEl.appendChild(div);
  });

  function selectPlayer(idx){
    document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.ptab')[idx].classList.add('active');
    document.querySelectorAll('.pdetail').forEach(d => d.classList.remove('active'));
    document.getElementById('pdetail-' + idx).classList.add('active');
    renderPlayerContent(idx);
    // обновляем hash без прыжка
    history.replaceState(null, '', '#player-' + idx);
  }

  function renderPlayerContent(idx){
    const p = MATCH.players[idx];
    const el = document.getElementById('pdetail-' + idx);
    if (el.dataset.rendered) return;
    el.dataset.rendered = '1';

    // HEAD
    const head = document.createElement('div');
    head.className = 'phead ' + p.team;
    head.innerHTML = `
      <div class="pav">${heroShortName(p.hero_slug)}</div>
      <div class="pinfo">
        <div class="pname">${p.name}</div>
        <div class="phero">${heroDisplayName(p.hero_slug)} · POS ${p.position}</div>
        <div class="ptags">
          <span class="ptag">${p.team === 'radiant' ? 'Radiant' : 'Dire'}</span>
          <span class="ptag">Уровень ${p.level}</span>
          <span class="ptag">${p.last_hits} LH / ${p.denies} DN</span>
        </div>
      </div>
      <div style="text-align:right">
        <div class="pkda">
          <span class="kda-k">${p.kills}</span><span class="kda-sep">/</span>
          <span class="kda-d">${p.deaths}</span><span class="kda-sep">/</span>
          <span class="kda-a">${p.assists}</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">
          GPM ${p.gold_per_min} · XPM ${p.xp_per_min} · NW ${(p.net_worth/1000).toFixed(1)}k
        </div>
      </div>`;
    el.appendChild(head);
    createImg(head.querySelector('.pav'),
      buildHeroSources(p.hero_slug), heroShortName(p.hero_slug));

    // STATS
    const stats = document.createElement('div');
    stats.className = 'stat-grid';
    [
      {l:'GPM', v:p.gold_per_min, c:'gold'},
      {l:'XPM', v:p.xp_per_min, c:'blue'},
      {l:'Net Worth', v:(p.net_worth/1000).toFixed(1)+'k', c:'purple'},
      {l:'Урон по героям', v:(p.hero_damage/1000).toFixed(1)+'k', c:'green'},
      {l:'Урон по строениям', v:(p.tower_damage/1000).toFixed(1)+'k', c:'gold'},
      {l:'Лечение', v:(p.hero_healing/1000).toFixed(1)+'k', c:'green'},
      {l:'Убийства', v:p.kills, c:'green'},
      {l:'Смерти', v:p.deaths, c:'red'},
      {l:'Помощь', v:p.assists, c:'blue'},
      {l:'Руны', v:p.rune_pickups, c:'purple'},
      {l:'Варды (obs/sen)', v:p.obs_placed+'/'+p.sen_placed, c:'gold'},
      {l:'Стаки', v:p.creeps_stacked+'/'+p.camps_stacked, c:'blue'},
    ].forEach(s => {
      const box = document.createElement('div');
      box.className = 'stat-box';
      box.innerHTML = `<div class="lbl">${s.l}</div>
        <div class="val ${s.c}">${s.v}</div>`;
      stats.appendChild(box);
    });
    el.appendChild(stats);

    // KILLS
    const killsCard = document.createElement('div');
    killsCard.className = 'card col-6';
    killsCard.innerHTML = '<div class="card-title">Убийства</div>';
    const killsScroll = document.createElement('div');
    killsScroll.className = 'scroll';
    if (p.kills_log && p.kills_log.length) {
      p.kills_log.forEach(k => {
        const row = document.createElement('div');
        row.className = 'kill-row';
        row.innerHTML = `
          <span class="time">${fmtTime(k.time)}</span>
          <div class="hero">
            <div class="himg">${heroShortName(k.key.replace('npc_dota_hero_',''))}</div>
            <span>${heroDisplayName(k.key.replace('npc_dota_hero_',''))}</span>
          </div>
          <span class="skull">☠</span>
          ${k.smoke ? '<span class="smoke">smoke</span>' : ''}`;
        const himg = row.querySelector('.himg');
        const slug = k.key.replace('npc_dota_hero_','');
        createImg(himg, buildHeroSources(slug), heroShortName(slug));
        killsScroll.appendChild(row);
      });
    } else {
      killsScroll.innerHTML = '<div style="padding:12px;color:var(--muted)">Нет убийств</div>';
    }
    killsCard.appendChild(killsScroll);
    el.appendChild(killsCard);

    // DEATHS
    const deathsCard = document.createElement('div');
    deathsCard.className = 'card col-6';
    deathsCard.innerHTML = '<div class="card-title">Смерти (кто убил)</div>';
    const deathsScroll = document.createElement('div');
    deathsScroll.className = 'scroll';
    if (p.killed_by && Object.keys(p.killed_by).length) {
      Object.entries(p.killed_by).forEach(([slug, count]) => {
        const row = document.createElement('div');
        row.className = 'kill-row';
        row.innerHTML = `
          <div class="hero">
            <div class="himg">${heroShortName(slug.replace('npc_dota_hero_',''))}</div>
            <span>${heroDisplayName(slug.replace('npc_dota_hero_',''))}</span>
          </div>
          <span style="margin-left:auto;font-family:'JetBrains Mono';font-weight:700;
            color:var(--dire)">×${count}</span>`;
        const himg = row.querySelector('.himg');
        const s = slug.replace('npc_dota_hero_','');
        createImg(himg, buildHeroSources(s), heroShortName(s));
        deathsScroll.appendChild(row);
      });
    } else {
      deathsScroll.innerHTML = '<div style="padding:12px;color:var(--muted)">Нет смертей</div>';
    }
    deathsCard.appendChild(deathsScroll);
    el.appendChild(deathsCard);

    // PURCHASES
    const buyCard = document.createElement('div');
    buyCard.className = 'card col-6';
    buyCard.innerHTML = '<div class="card-title">Покупки</div>';
    const buyScroll = document.createElement('div');
    buyScroll.className = 'scroll';
    if (p.purchase_log && p.purchase_log.length) {
      [...p.purchase_log].sort((a,b) => a.time - b.time).forEach(pur => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <span class="time" style="min-width:52px">${fmtTime(pur.time)}</span>
          <div class="iimg">${pur.key.slice(0,4).toUpperCase()}</div>
          <span class="iname">${pur.key.replace(/_/g,' ')}</span>`;
        createImg(row.querySelector('.iimg'),
          buildItemSources(pur.key), pur.key.slice(0,4).toUpperCase());
        buyScroll.appendChild(row);
      });
    }
    buyCard.appendChild(buyScroll);
    el.appendChild(buyCard);

    // ITEM USES
    const itemCard = document.createElement('div');
    itemCard.className = 'card col-6';
    itemCard.innerHTML = '<div class="card-title">Использование предметов</div>';
    const itemScroll = document.createElement('div');
    itemScroll.className = 'scroll';
    if (p.item_uses && Object.keys(p.item_uses).length) {
      Object.entries(p.item_uses).sort((a,b) => b[1] - a[1]).forEach(([key, count]) => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="iimg">${key.slice(0,4).toUpperCase()}</div>
          <span class="iname">${key.replace(/_/g,' ')}</span>
          <span class="icount">${count}×</span>`;
        createImg(row.querySelector('.iimg'),
          buildItemSources(key), key.slice(0,4).toUpperCase());
        itemScroll.appendChild(row);
      });
    }
    itemCard.appendChild(itemScroll);
    el.appendChild(itemCard);

    // ABILITIES
    const abCard = document.createElement('div');
    abCard.className = 'card col-6';
    abCard.innerHTML = '<div class="card-title">Способности</div>';
    const abScroll = document.createElement('div');
    abScroll.className = 'scroll';
    if (p.ability_uses && Object.keys(p.ability_uses).length) {
      const abGrid = document.createElement('div');
      abGrid.className = 'ab-grid';
      abGrid.style.padding = '8px';
      Object.entries(p.ability_uses).sort((a,b) => b[1] - a[1]).forEach(([key, count]) => {
        const card = document.createElement('div');
        card.className = 'ab-card';
        card.innerHTML = `<span class="aname">${key.replace(/_/g,' ')}</span>
          <span class="acount">${count}×</span>`;
        abGrid.appendChild(card);
      });
      abScroll.appendChild(abGrid);
    }
    abCard.appendChild(abScroll);
    el.appendChild(abCard);

    // BUYBACK
    const bbCard = document.createElement('div');
    bbCard.className = 'card col-4';
    bbCard.innerHTML = '<div class="card-title">Байбеки</div>';
    const bbScroll = document.createElement('div');
    bbScroll.className = 'scroll';
    if (p.buyback_log && p.buyback_log.length) {
      p.buyback_log.forEach(bb => {
        const row = document.createElement('div');
        row.className = 'bb-row';
        row.innerHTML = `<span class="time">${fmtTime(bb.time)}</span>
          <span style="color:var(--muted)">Байбек</span>`;
        bbScroll.appendChild(row);
      });
    } else {
      bbScroll.innerHTML = '<div style="padding:12px;color:var(--muted)">Нет байбеков</div>';
    }
    bbCard.appendChild(bbScroll);
    el.appendChild(bbCard);

    // RUNES
    const runeCard = document.createElement('div');
    runeCard.className = 'card col-4';
    runeCard.innerHTML = '<div class="card-title">Руны</div>';
    const runeScroll = document.createElement('div');
    runeScroll.className = 'scroll';
    if (p.runes_log && p.runes_log.length) {
      p.runes_log.forEach(r => {
        const row = document.createElement('div');
        row.className = 'bb-row';
        row.innerHTML = `<span class="time">${fmtTime(r.time)}</span>
          <span style="color:var(--muted)">Руна #${r.key}</span>`;
        runeScroll.appendChild(row);
      });
    } else {
      runeScroll.innerHTML = '<div style="padding:12px;color:var(--muted)">Нет рун</div>';
    }
    runeCard.appendChild(runeScroll);
    el.appendChild(runeCard);

    // STREAKS
    const streakCard = document.createElement('div');
    streakCard.className = 'card col-4';
    streakCard.innerHTML = '<div class="card-title">Серии убийств</div>';
    const streakContent = document.createElement('div');
    streakContent.style.padding = '8px';
    if (p.kill_streaks && Object.keys(p.kill_streaks).length) {
      Object.entries(p.kill_streaks).forEach(([streak, count]) => {
        const row = document.createElement('div');
        row.className = 'bb-row';
        row.innerHTML = `<span class="time">${streak} kills</span>
          <span style="color:var(--muted)">×${count}</span>`;
        streakContent.appendChild(row);
      });
    }
    if (p.multi_kills && Object.keys(p.multi_kills).length) {
      const mkWrap = document.createElement('div');
      mkWrap.style.marginTop = '8px';
      mkWrap.innerHTML = '<div style="font-size:11px;color:var(--muted);' +
        'text-transform:uppercase;letter-spacing:1.5px;padding:0 10px 6px">Мульти-убийства</div>';
      Object.entries(p.multi_kills).forEach(([mk, count]) => {
        const row = document.createElement('div');
        row.className = 'bb-row';
        row.innerHTML = `<span class="time">${mk}×</span>
          <span style="color:var(--muted)">×${count}</span>`;
        mkWrap.appendChild(row);
      });
      streakContent.appendChild(mkWrap);
    }
    streakCard.appendChild(streakContent);
    el.appendChild(streakCard);

    // LIFE STATE
    const lifeCard = document.createElement('div');
    lifeCard.className = 'card col-4';
    lifeCard.innerHTML = '<div class="card-title">Время в состояниях</div>';
    const lifeContent = document.createElement('div');
    lifeContent.style.padding = '8px';
    if (p.life_state) {
      const total = Object.values(p.life_state).reduce((a,b) => a+b, 0);
      const labels = {'0':'Жив','1':'Активный','2':'Мёртв'};
      Object.entries(p.life_state).forEach(([k, v]) => {
        const pct = total ? (v/total*100).toFixed(1) : 0;
        const row = document.createElement('div');
        row.className = 'bb-row';
        row.innerHTML = `<span class="time">${labels[k] || k}</span>
          <span style="color:var(--muted)">${fmtTime(v)} (${pct}%)</span>`;
        lifeContent.appendChild(row);
      });
    }
    lifeCard.appendChild(lifeContent);
    el.appendChild(lifeCard);

    // HEALING
    if (p.healing) {
      const healCard = document.createElement('div');
      healCard.className = 'card col-6';
      healCard.innerHTML = '<div class="card-title">Лечение</div>';
      const healScroll = document.createElement('div');
      healScroll.className = 'scroll';
      Object.entries(p.healing).forEach(([target, val]) => {
        const row = document.createElement('div');
        row.className = 'kill-row';
        let label = target.replace('npc_dota_hero_','').replace('illusion_','(иллюзия) ');
        row.innerHTML = `<span>${heroDisplayName(label)}</span>
          <span style="margin-left:auto;font-family:'JetBrains Mono';
            font-weight:700;color:var(--radiant)">${val.toLocaleString()}</span>`;
        healScroll.appendChild(row);
      });
      healCard.appendChild(healScroll);
      el.appendChild(healCard);
    }
  }

  // --- выбор игрока с учётом #player-N ---
  let initialIdx = 0;
  const hashMatch = location.hash.match(/^#player-(\d+)$/);
  if (hashMatch) {
    const n = parseInt(hashMatch[1], 10);
    if (n >= 0 && n < MATCH.players.length) initialIdx = n;
  }
  selectPlayer(initialIdx);

  // реакция на изменение hash (если пользователь меняет вручную)
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#player-(\d+)$/);
    if (m) {
      const n = parseInt(m[1], 10);
      if (n >= 0 && n < MATCH.players.length) selectPlayer(n);
    }
  });
})();
</script>
</body>
</html>
